<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using HTML5 input types such as email, date, number, and password</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>HTML Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>9. Create a webpage using HTML5 input types such as email, date, number, and password</h1>
      <p class="description">Demonstrates newer input types introduced in HTML5: date, range, color, number, tel, url and search.</p>
      <div class="demo-area">
<form class="demo-form">
  <label for="dob">Date</label><input type="date" id="dob">
  <label for="vol">Range (volume)</label><input type="range" id="vol" min="0" max="100" value="50">
  <label for="col">Color</label><input type="color" id="col" value="#2e5aac" style="height:44px;">
  <label for="qty">Number</label><input type="number" id="qty" min="1" max="10" value="1">
  <label for="phone">Telephone</label><input type="tel" id="phone" placeholder="+91 XXXXXXXXXX">
  <label for="site">URL</label><input type="url" id="site" placeholder="https://example.com">
  <label for="srch">Search</label><input type="search" id="srch" placeholder="Search...">
</form>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to HTML Programs</a>
      </div>
    </div>
  </main>

  <footer>HTML Programs &mdash; Question 9 of 425</footer>

</body>
</html>
