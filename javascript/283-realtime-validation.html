<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a strong password validator</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>283. Create a strong password validator</h1>
      <p class="description">Demonstrates showing a password strength meter that updates live as the user types.</p>
      <div class="demo-area">
<div class="demo-form"><label for="strengthInput">Password</label><input type="password" id="strengthInput" oninput="checkStrength()"></div><div id="strengthBarTrack" style="background:var(--light-blue); border-radius:6px; height:10px; margin-top:10px; overflow:hidden;"><div id="strengthBar" style="height:100%; width:0%; background:#c0392b; transition:all 0.3s ease;"></div></div><p id="strengthLabel" style="font-weight:700; margin-top:6px;"></p>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 283 of 425</footer>
<script>
function checkStrength() {
  const value = document.getElementById('strengthInput').value;
  let score = 0;
  if (value.length >= 6) score++;
  if (value.length >= 10) score++;
  if (/[A-Z]/.test(value)) score++;
  if (/[0-9]/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;
  const percentages = [0, 20, 40, 60, 80, 100];
  const labels = ['', 'Very Weak', 'Weak', 'Okay', 'Strong', 'Very Strong'];
  const colors = ['#c0392b', '#c0392b', '#d68910', '#d68910', '#1e8449', '#1e8449'];
  document.getElementById('strengthBar').style.width = percentages[score] + '%';
  document.getElementById('strengthBar').style.background = colors[score];
  document.getElementById('strengthLabel').textContent = value === '' ? '' : labels[score];
  document.getElementById('strengthLabel').style.color = colors[score];
}
</script>
</body>
</html>
