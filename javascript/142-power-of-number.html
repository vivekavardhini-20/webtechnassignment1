<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to calculate the power of a number</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>142. Write a program to calculate the power of a number</h1>
      <p class="description">Calculates base raised to exponent using both the ** operator and Math.pow().</p>
      <div class="demo-area">
<div class="row"><input type="number" id="baseInput" value="2"><input type="number" id="expInput" value="10"><button onclick="calcPower()">Calculate</button></div><div class="box" id="powerOut"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 142 of 425</footer>
<script>
function calcPower() {
  const base = Number(document.getElementById('baseInput').value);
  const exp = Number(document.getElementById('expInput').value);
  document.getElementById('powerOut').textContent = `${base} ^ ${exp} = ${base ** exp} (Math.pow: ${Math.pow(base, exp)})`;
}
calcPower();
</script>
</body>
</html>
