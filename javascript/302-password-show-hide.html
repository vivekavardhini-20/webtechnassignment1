<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a show/hide password option</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>302. Create a show/hide password option</h1>
      <p class="description">Demonstrates toggling a password input between hidden and visible text using JavaScript.</p>
      <div class="demo-area">
<div class="row"><input type="password" id="pwShowHideInput" value="mypassword123"><button onclick="togglePasswordVisibility()" id="pwToggleBtn">Show</button></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 302 of 425</footer>
<script>
function togglePasswordVisibility() {
  const input = document.getElementById('pwShowHideInput');
  const btn = document.getElementById('pwToggleBtn');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
  else { input.type = 'password'; btn.textContent = 'Show'; }
}
</script>
</body>
</html>
