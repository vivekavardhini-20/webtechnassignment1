<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a program to add, edit, and delete to-do items</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
#todoList li { display: flex; align-items: center; justify-content: space-between; background: var(--light-blue); padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; } #todoList li.completed span { text-decoration: line-through; color: var(--muted); } #todoList li .task-text { cursor: pointer; flex: 1; } #todoList li .delete-btn { background: #c0392b; padding: 4px 10px; }
</style>
</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>244. Create a program to add, edit, and delete to-do items</h1>
      <p class="description">Add, complete and delete tasks. Demonstrates DOM creation, event delegation and array-based state management in JavaScript.</p>
      <div class="demo-area">
<div class="row"><input type="text" id="taskInput" placeholder="Add a new task..." onkeydown="if(event.key==='Enter') addTask();" style="flex:1;"><button onclick="addTask()">Add</button></div><ul id="todoList" style="list-style:none; padding:0;"></ul>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 244 of 425</footer>
<script>
const taskInput = document.getElementById('taskInput');
const todoList = document.getElementById('todoList');
let tasks = [], nextId = 1;
function addTask() {
  const text = taskInput.value.trim();
  if (text === '') return;
  tasks.push({ id: nextId++, text, completed: false });
  taskInput.value = '';
  renderTasks();
}
function toggleTask(id) { const t = tasks.find(t => t.id === id); if (t) t.completed = !t.completed; renderTasks(); }
function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); renderTasks(); }
function renderTasks() {
  todoList.innerHTML = '';
  tasks.forEach(task => {
    const li = document.createElement('li');
    if (task.completed) li.classList.add('completed');
    const span = document.createElement('span');
    span.className = 'task-text'; span.textContent = task.text;
    span.addEventListener('click', () => toggleTask(task.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn'; delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => deleteTask(task.id));
    li.appendChild(span); li.appendChild(delBtn);
    todoList.appendChild(li);
  });
}
</script>
</body>
</html>
