<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a digital clock using JavaScript</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
#clock { font-size: 3rem; font-weight: 700; color: var(--navy); text-align: center; letter-spacing: 2px; background: var(--light-blue); padding: 30px; border-radius: 12px; } #date-line { text-align: center; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>116. Create a digital clock using JavaScript</h1>
      <p class="description">Displays the current time, updated every second using setInterval and the built-in Date object.</p>
      <div class="demo-area">
<div id="clock">--:--:--</div><div id="date-line"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 116 of 425</footer>
<script>
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date-line');
function pad(n) { return n.toString().padStart(2, '0'); }
function updateClock() {
  const now = new Date();
  clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
