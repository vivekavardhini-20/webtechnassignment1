      <h1>129. Demonstrate inheritance in JavaScript</h1>
      <p class="description">Demonstrates class inheritance using 'extends' and 'super', where a subclass builds on a base class.</p>
      <div class="demo-area">
<pre id="inheritDemoOut"></pre>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>

  <footer>JavaScript Programs &mdash; Question 129 of 425</footer>
<script>
class Person {
  constructor(name) { this.name = name; }
  greet() { return `Hi, I'm ${this.name}`; }
}
class Student extends Person {
  constructor(name, course) { super(name); this.course = course; } // calls Person's constructor
  greet() { return `${super.greet()} and I study ${this.course}`; } // extends parent method
}
const student = new Student('Shaik Abdulkalam', 'CSE AI/ML');
document.getElementById('inheritDemoOut').textContent = student.greet();
</script>
