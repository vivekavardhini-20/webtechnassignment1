<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstrate alert(), confirm(), and prompt()</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>317. Demonstrate alert(), confirm(), and prompt()</h1>
      <p class="description">Demonstrates all three built-in window dialog methods for interacting with the user.</p>
      <div class="demo-area">
<div class="row"><button onclick="window.alert('This is an alert box')">alert()</button><button onclick="runConfirmDemo()">confirm()</button><button onclick="runPromptDemo()">prompt()</button></div><p id="dialogDemoOut"></p>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 317 of 425</footer>
<script>
function runConfirmDemo() {
  const result = window.confirm('Do you confirm this action?');
  document.getElementById('dialogDemoOut').textContent = 'confirm() returned: ' + result;
}
function runPromptDemo() {
  const name = window.prompt('What is your name?', 'Shaik');
  document.getElementById('dialogDemoOut').textContent = 'prompt() returned: ' + name;
}
</script>
</body>
</html>
