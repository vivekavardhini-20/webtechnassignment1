<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a tic-tac-toe game</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.ttt-board { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; margin-bottom: 12px; } .ttt-board button { width: 60px; height: 60px; font-size: 1.5rem; font-weight: 700; background: #fff; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>202. Create a tic-tac-toe game</h1>
      <p class="description">A classic two-player Tic-Tac-Toe game with win detection, built with a 3x3 grid of buttons.</p>
      <div class="demo-area">
<div id="tttBoard" class="ttt-board"></div><p id="tttStatus" style="font-weight:700;"></p><button onclick="resetTTT()">Reset Game</button>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 202 of 425</footer>
<script>
let tttBoard = Array(9).fill('');
let tttTurn = 'X';
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function renderTTT() {
  const boardEl = document.getElementById('tttBoard');
  boardEl.innerHTML = '';
  tttBoard.forEach((cell, i) => {
    const btn = document.createElement('button');
    btn.textContent = cell;
    btn.onclick = () => tttMove(i);
    boardEl.appendChild(btn);
  });
}
function tttMove(i) {
  if (tttBoard[i] !== '') return;
  tttBoard[i] = tttTurn;
  const winner = wins.find(([a,b,c]) => tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[b] === tttBoard[c]);
  renderTTT();
  if (winner) { document.getElementById('tttStatus').textContent = `${tttTurn} wins!`; return; }
  if (!tttBoard.includes('')) { document.getElementById('tttStatus').textContent = "It's a draw!"; return; }
  tttTurn = tttTurn === 'X' ? 'O' : 'X';
  document.getElementById('tttStatus').textContent = `${tttTurn}'s turn`;
}
function resetTTT() { tttBoard = Array(9).fill(''); tttTurn = 'X'; document.getElementById('tttStatus').textContent = "X's turn"; renderTTT(); }
resetTTT();
</script>
</body>
</html>
