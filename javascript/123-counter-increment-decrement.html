<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a counter application with increment and decrement buttons</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>123. Create a counter application with increment and decrement buttons</h1>
      <p class="description">A simple counter application with buttons to increase, decrease, and reset a numeric value.</p>
      <div class="demo-area">
<p class="box" id="counterAppValue" style="font-size:2rem;">0</p><div class="row" style="justify-content:center;"><button onclick="changeCounter(-1)">-</button><button onclick="changeCounter(0)">Reset</button><button onclick="changeCounter(1)">+</button></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 123 of 425</footer>
<script>
let counterAppValue = 0;
function changeCounter(delta) {
  counterAppValue = delta === 0 ? 0 : counterAppValue + delta;
  document.getElementById('counterAppValue').textContent = counterAppValue;
}
</script>
</body>
</html>
