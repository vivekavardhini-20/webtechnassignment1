<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to find the largest of three numbers</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>93. Write a program to find the largest of three numbers</h1>
      <p class="description">Compares three numbers using Math.max() to find the largest.</p>
      <div class="demo-area">
<div class="row"><input type="number" id="n1" value="12"><input type="number" id="n2" value="45"><input type="number" id="n3" value="7"><button onclick="findLargest3()">Find Largest</button></div><div class="box" id="largest3Out"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 93 of 425</footer>
<script>
function findLargest3() {
  const a = Number(document.getElementById('n1').value);
  const b = Number(document.getElementById('n2').value);
  const c = Number(document.getElementById('n3').value);
  document.getElementById('largest3Out').textContent = 'Largest: ' + Math.max(a, b, c);
}
findLargest3();
</script>
</body>
</html>
