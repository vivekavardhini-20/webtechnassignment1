<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display API data dynamically on a webpage</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>132. Display API data dynamically on a webpage</h1>
      <p class="description">Demonstrates using the Fetch API with async/await to retrieve JSON data from a public REST endpoint.</p>
      <div class="demo-area">
<button onclick="fetchTodo()">Fetch a Sample To-Do (public API)</button><pre id="fetchOutput"></pre>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 132 of 425</footer>
<script>
async function fetchTodo() {
  const output = document.getElementById('fetchOutput');
  output.textContent = 'Fetching...';
  try {
    const response = await fetch('https://jsonplaceholder.typicode.com/todos/1');
    if (!response.ok) throw new Error('Network response was not ok');
    const data = await response.json();
    output.textContent = 'Fetched data:\n' + JSON.stringify(data, null, 2);
  } catch (error) {
    output.textContent = 'Fetch failed (check your internet connection): ' + error.message;
  }
}
</script>
</body>
</html>
