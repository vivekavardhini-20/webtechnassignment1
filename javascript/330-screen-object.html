<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display the user's screen width and height</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>330. Display the user's screen width and height</h1>
      <p class="description">Demonstrates reading the user's physical screen resolution and color depth via the screen object.</p>
      <div class="demo-area">
<pre id="screenInfo"></pre>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 330 of 425</footer>
<script>
document.getElementById('screenInfo').textContent =
`screen.width: ${screen.width}
screen.height: ${screen.height}
screen.availWidth: ${screen.availWidth}
screen.availHeight: ${screen.availHeight}
screen.colorDepth: ${screen.colorDepth}-bit`;
</script>
</body>
</html>
