<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a number guessing game</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>118. Create a number guessing game</h1>
      <p class="description">The computer picks a random number between 1 and 100; the player guesses and gets higher/lower feedback until correct.</p>
      <div class="demo-area">
<p>Guess a number between 1 and 100:</p><div class="row"><input type="number" id="guessInput" min="1" max="100"><button onclick="checkGuess()">Guess</button><button onclick="resetGame()">Reset</button></div><p id="guessFeedback" style="font-weight:700;"></p><p id="attemptsText" style="color:var(--muted);"></p>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 118 of 425</footer>
<script>
let secretNumber = Math.floor(Math.random() * 100) + 1;
let attempts = 0;
function checkGuess() {
  const guess = parseInt(document.getElementById('guessInput').value, 10);
  const feedback = document.getElementById('guessFeedback');
  if (isNaN(guess)) { feedback.textContent = 'Please enter a valid number.'; return; }
  attempts++;
  if (guess === secretNumber) {
    feedback.style.color = '#1e8449';
    feedback.textContent = `Correct! The number was ${secretNumber}.`;
  } else if (guess < secretNumber) {
    feedback.style.color = 'var(--accent)';
    feedback.textContent = 'Too low - try a higher number.';
  } else {
    feedback.style.color = 'var(--accent)';
    feedback.textContent = 'Too high - try a lower number.';
  }
  document.getElementById('attemptsText').textContent = `Attempts: ${attempts}`;
}
function resetGame() {
  secretNumber = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  document.getElementById('guessFeedback').textContent = '';
  document.getElementById('attemptsText').textContent = '';
  document.getElementById('guessInput').value = '';
}
</script>
</body>
</html>
