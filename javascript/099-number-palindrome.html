<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to check whether a number is a palindrome</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>99. Write a program to check whether a number is a palindrome</h1>
      <p class="description">Reverses the number's digits and compares the reversed value with the original.</p>
      <div class="demo-area">
<div class="row"><input type="number" id="numPalInput" value="12321"><button onclick="checkNumPalindrome()">Check</button></div><div class="box" id="numPalOut"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 99 of 425</footer>
<script>
function checkNumPalindrome() {
  const original = document.getElementById('numPalInput').value.trim();
  const reversed = original.split('').reverse().join('');
  document.getElementById('numPalOut').textContent = original + ' is ' + (original === reversed ? 'a Palindrome' : 'NOT a Palindrome');
}
checkNumPalindrome();
</script>
</body>
</html>
