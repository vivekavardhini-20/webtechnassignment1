<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a drag-and-drop application using JavaScript</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>178. Create a drag-and-drop application using JavaScript</h1>
      <p class="description">Demonstrates the native HTML5 Drag and Drop API by letting the user drag items into a drop zone.</p>
      <div class="demo-area">
<div class="row"><div class="box" draggable="true" id="dragItem" style="cursor:grab;">Drag me</div></div><div id="dropZone" style="margin-top:12px; height:100px; border:2px dashed var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted);">Drop here</div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 178 of 425</footer>
<script>
const dragItem = document.getElementById('dragItem');
const dropZone = document.getElementById('dropZone');
dragItem.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', 'dragItem'); });
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'var(--light-blue)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.background = ''; });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.style.background = '';
  dropZone.textContent = 'Dropped successfully! 🎉';
  dropZone.style.color = '#1e8449';
  dropZone.style.fontWeight = '700';
});
</script>
</body>
</html>
