<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage with multiple buttons having different event handlers</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>262. Create a webpage with multiple buttons having different event handlers</h1>
      <p class="description">Demonstrates attaching distinct click handlers to several buttons on the same page.</p>
      <div class="demo-area">
<div class="row"><button onclick="showMsg('Red selected')" style="background:#c0392b;">Red</button><button onclick="showMsg('Green selected')" style="background:#1e8449;">Green</button><button onclick="showMsg('Blue selected')" style="background:#2e5aac;">Blue</button></div><div class="box" id="multiBtnOut">Click a button</div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 262 of 425</footer>
<script>
function showMsg(msg) { document.getElementById('multiBtnOut').textContent = msg; }
</script>
</body>
</html>
