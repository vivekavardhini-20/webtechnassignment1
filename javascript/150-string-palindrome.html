<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to check whether a string is a palindrome</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>150. Write a program to check whether a string is a palindrome</h1>
      <p class="description">Compares a cleaned, lowercased string with its reverse to check for palindromes (ignoring spaces/case).</p>
      <div class="demo-area">
<input type="text" id="strPalInput" value="Madam"><button onclick="checkStringPalindrome()">Check</button><div class="box" id="strPalOut"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 150 of 425</footer>
<script>
function checkStringPalindrome() {
  const raw = document.getElementById('strPalInput').value;
  const clean = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
  const reversed = clean.split('').reverse().join('');
  document.getElementById('strPalOut').textContent = `"${raw}" is ` + (clean === reversed ? 'a Palindrome' : 'NOT a Palindrome');
}
checkStringPalindrome();
</script>
</body>
</html>
