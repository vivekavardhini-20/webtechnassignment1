<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validate a date of birth field</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>285. Validate a date of birth field</h1>
      <p class="description">Demonstrates checking that a selected date of birth is not in the future.</p>
      <div class="demo-area">
<input type="date" id="dobFieldInput" onchange="validateDobField()"><p id="dobFieldOut" class="error-text"></p>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 285 of 425</footer>
<script>
function validateDobField() {
  const dob = new Date(document.getElementById('dobFieldInput').value);
  const out = document.getElementById('dobFieldOut');
  out.textContent = dob > new Date() ? 'Date of birth cannot be in the future.' : '';
}
</script>
</body>
</html>
