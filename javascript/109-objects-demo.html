<script>
const car = {
  brand: 'Toyota', model: 'Corolla', year: 2023,
  describe() { return `${this.brand} ${this.model} (${this.year})`; }
};
document.getElementById('objectsDemoOut').textContent =
`car.brand: ${car.brand}\ncar.describe(): ${car.describe()}`;
