<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a dynamic student table using JavaScript</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
#tableContainer table { width: 100%; border-collapse: collapse; } #tableContainer th, #tableContainer td { border: 1px solid var(--border); padding: 8px; text-align: left; } #tableContainer th { background: var(--navy); color: #fff; }
</style>
</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>223. Create a dynamic student table using JavaScript</h1>
      <p class="description">Builds an HTML table dynamically from a JavaScript array of objects using DOM methods.</p>
      <div class="demo-area">
<button onclick="generateTable()">Generate Table from Data</button><div id="tableContainer" style="margin-top:12px;"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 223 of 425</footer>
<script>
const students = [
  { name: 'Shaik Abdulkalam', subject: 'DSA', marks: 92 },
  { name: 'Priya Sharma', subject: 'Web Tech', marks: 88 },
  { name: 'Rahul Verma', subject: 'DAA', marks: 95 }
];
function generateTable() {
  const container = document.getElementById('tableContainer');
  container.innerHTML = '';
  const table = document.createElement('table');
  const headerRow = document.createElement('tr');
  ['Name', 'Subject', 'Marks'].forEach(text => {
    const th = document.createElement('th');
    th.textContent = text;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);
  students.forEach(student => {
    const row = document.createElement('tr');
    [student.name, student.subject, student.marks].forEach(value => {
      const td = document.createElement('td');
      td.textContent = value;
      row.appendChild(td);
    });
    table.appendChild(row);
  });
  container.appendChild(table);
}
</script>
</body>
</html>
