<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a login preference system using localStorage</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>348. Create a login preference system using localStorage</h1>
      <p class="description">Demonstrates a 'Remember Me' style checkbox that saves the username for next time using localStorage.</p>
      <div class="demo-area">
<div class="demo-form"><label>Username</label><input type="text" id="rememberUsername"><label><input type="checkbox" id="rememberMeCheck" style="width:auto; display:inline;"> Remember me</label><button onclick="saveLoginPref()">Save Preference</button></div><p id="loginPrefOut" style="color:var(--muted);"></p>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 348 of 425</footer>
<script>
function saveLoginPref() {
  const username = document.getElementById('rememberUsername').value;
  const remember = document.getElementById('rememberMeCheck').checked;
  if (remember) localStorage.setItem('rememberedUsername', username);
  else localStorage.removeItem('rememberedUsername');
  document.getElementById('loginPrefOut').textContent = 'Saved. Remembered username: ' + (localStorage.getItem('rememberedUsername') || '(none)');
}
// On load, pre-fill from any previously remembered username
document.getElementById('rememberUsername').value = localStorage.getItem('rememberedUsername') || '';
</script>
</body>
</html>
