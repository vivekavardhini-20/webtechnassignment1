<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a multi-step registration form</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>308. Create a multi-step registration form</h1>
      <p class="description">Demonstrates a registration form split across multiple steps, with Next/Back navigation between them.</p>
      <div class="demo-area">
<div id="stepIndicator" style="font-weight:700; margin-bottom:10px;">Step 1 of 3</div><div class="demo-form step-panel" data-step="1"><label>Name</label><input type="text"></div><div class="demo-form step-panel" data-step="2" style="display:none;"><label>Email</label><input type="email"></div><div class="demo-form step-panel" data-step="3" style="display:none;"><label>Password</label><input type="password"></div><div class="row"><button onclick="changeStep(-1)">Back</button><button onclick="changeStep(1)">Next</button></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 308 of 425</footer>
<script>
let currentStep = 1;
function changeStep(direction) {
  const newStep = currentStep + direction;
  if (newStep < 1 || newStep > 3) return;
  document.querySelector(`.step-panel[data-step="${currentStep}"]`).style.display = 'none';
  currentStep = newStep;
  document.querySelector(`.step-panel[data-step="${currentStep}"]`).style.display = 'block';
  document.getElementById('stepIndicator').textContent = `Step ${currentStep} of 3`;
}
</script>
</body>
</html>
