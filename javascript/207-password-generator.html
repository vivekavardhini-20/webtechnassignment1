<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a random password generator</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>207. Create a random password generator</h1>
      <p class="description">Generates a random password of a chosen length using letters, numbers and symbols.</p>
      <div class="demo-area">
<div class="demo-form"><label for="pwLength">Length</label><input type="number" id="pwLength" value="12" min="4" max="32"><button onclick="generatePassword()">Generate Password</button></div><div class="box" id="pwOutput" style="margin-top:14px; word-break:break-all;"></div>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 207 of 425</footer>
<script>
function generatePassword() {
  const length = parseInt(document.getElementById('pwLength').value, 10) || 12;
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
  let password = '';
  for (let i = 0; i < length; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('pwOutput').textContent = password;
}
</script>
</body>
</html>
