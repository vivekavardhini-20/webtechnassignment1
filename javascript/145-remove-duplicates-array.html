<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to remove duplicate elements from an array</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

  <header class="site-header"><h1>JavaScript Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>145. Write a program to remove duplicate elements from an array</h1>
      <p class="description">Removes duplicates using the Set data structure, which only stores unique values.</p>
      <div class="demo-area">
<input type="text" id="dedupInput" value="1, 2, 2, 3, 4, 4, 5"><button onclick="removeDuplicates()">Remove Duplicates</button><pre id="dedupOut"></pre>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to JavaScript Programs</a>
      </div>
    </div>
  </main>

  <footer>JavaScript Programs &mdash; Question 145 of 425</footer>
<script>
function removeDuplicates() {
  const arr = document.getElementById('dedupInput').value.split(',').map(s => s.trim());
  const unique = [...new Set(arr)];
  document.getElementById('dedupOut').textContent = `Original: [${arr.join(', ')}]\nUnique: [${unique.join(', ')}]`;
}
removeDuplicates();
</script>
</body>
</html>
