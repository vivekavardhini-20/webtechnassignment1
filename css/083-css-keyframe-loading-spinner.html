<title>Create a loading spinner animation using CSS</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.spinner { width: 50px; height: 50px; border: 6px solid var(--light-blue); border-top: 6px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div class="spinner"></div>
