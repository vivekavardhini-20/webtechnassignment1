<title>Create an image hover effect using CSS</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.img-hover-wrap { position: relative; width: 180px; height: 130px; overflow: hidden; border-radius: 10px; } .img-hover-box { width: 100%; height: 100%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: transform 0.3s ease; } .img-hover-overlay { position: absolute; inset: 0; background: rgba(31,56,100,0.75); color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; font-weight: 700; } .img-hover-wrap:hover .img-hover-box { transform: scale(1.1); } .img-hover-wrap:hover .img-hover-overlay { opacity: 1; }
</style>
</head>

<div class="img-hover-wrap"><div class="img-hover-box">Photo</div><div class="img-hover-overlay">View Details</div></div>
