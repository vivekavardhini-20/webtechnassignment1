<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage demonstrating CSS variables (custom properties)</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-area { --theme-color: #2e5aac; } .theme-box { background: var(--theme-color); color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 14px; transition: background 0.3s ease; }
</style>
</head>
<body>

  <header class="site-header"><h1>CSS Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>44. Create a webpage demonstrating CSS variables (custom properties)</h1>
      <p class="description">Demonstrates defining and reusing CSS variables, and changing a theme by updating a single variable.</p>
      <div class="demo-area">
<div class="theme-box" id="themeBox">Themed box using var(--theme-color)</div><button id="greenBtn">Switch to Green</button> <button id="redBtn">Switch to Red</button>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to CSS Programs</a>
      </div>
    </div>
  </main>

  <footer>CSS Programs &mdash; Question 44 of 425</footer>
<script>
document.getElementById('greenBtn').addEventListener('click', () => { document.querySelector('.demo-area').style.setProperty('--theme-color', '#1e8449'); }); document.getElementById('redBtn').addEventListener('click', () => { document.querySelector('.demo-area').style.setProperty('--theme-color', '#c0392b'); });
</script>
</body>
</html>
