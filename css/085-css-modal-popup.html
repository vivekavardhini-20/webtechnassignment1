</style>

<label for="modalToggle" class="btn">Open Modal</label><input type="checkbox" id="modalToggle" class="modal-toggle-input"><div class="modal-overlay"><div class="modal-box"><h3>Modal Title</h3><p>This popup is controlled entirely with CSS using a hidden checkbox.</p><label for="modalToggle" class="btn">Close</label></div></div>
