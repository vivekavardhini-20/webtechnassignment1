<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a styled navigation bar using CSS</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.rnav { display: flex; align-items: center; justify-content: space-between; background: var(--navy); padding: 10px 16px; border-radius: 8px; position: relative; } .rnav-brand { color: #fff; font-weight: 700; } .rnav-links { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; } .rnav-links a { color: #fff; text-decoration: none; } .rnav-toggle, .rnav-toggle-input { display: none; } @media (max-width: 500px) { .rnav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--navy); padding: 10px; } .rnav-toggle { display: block; color: #fff; cursor: pointer; font-size: 1.4rem; } .rnav-toggle-input:checked ~ .rnav-links { display: flex; } }
</style>
</head>
<body>

  <header class="site-header"><h1>CSS Programs</h1></header>

  <main>
    <div class="program-page">
      <h1>24. Create a styled navigation bar using CSS</h1>
      <p class="description">A navigation bar that collapses into a hamburger-toggled menu on small screens using a checkbox-based CSS-only toggle.</p>
      <div class="demo-area">
<nav class="rnav"><div class="rnav-brand">MySite</div><input type="checkbox" id="rnavToggle" class="rnav-toggle-input"><label for="rnavToggle" class="rnav-toggle">&#9776;</label><ul class="rnav-links"><li><a href="#">Home</a></li><li><a href="#">About</a></li><li><a href="#">Services</a></li><li><a href="#">Contact</a></li></ul></nav>
</div>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a class="secondary" href="index.html">Back to CSS Programs</a>
      </div>
    </div>
  </main>

  <footer>CSS Programs &mdash; Question 24 of 425</footer>

</body>
</html>
